syntax = "proto3";
package enginepb;
option go_package = "github.com/zenion/mmoserver/gen/go/enginepb";
option csharp_namespace = "Zenion.GameServer.Proto.Engine";

// ═══════════════════════════════════════════════
// ENVELOPES
// ═══════════════════════════════════════════════

message ClientEvent {
    uint32 code = 1;     // ClientEventCode identifying the event type
    bytes data = 2;      // serialized event-specific message
}

message ServerEvent {
    uint32 code = 1;     // ServerEventCode identifying the event type
    bytes data = 2;      // serialized event-specific message
}

// ═══════════════════════════════════════════════
// OPERATIONS — request/response, services (channel 0x01)
// ═══════════════════════════════════════════════

message OperationRequest {
    uint32 code = 1;         // OperationCode
    uint32 request_id = 2;   // client-assigned correlation ID, echoed in response
    bytes data = 3;          // serialized op-specific request
}

message OperationResponse {
    uint32 code = 1;         // OperationCode (echoed from request)
    uint32 request_id = 2;   // correlation ID (echoed, 0 = server-pushed notification)
    int32 return_code = 3;   // 0 = success, non-zero = error
    string error_msg = 4;    // human-readable error detail
    bytes data = 5;          // serialized op-specific response
}

// ═══════════════════════════════════════════════
// ENGINE EVENT CODES
// ═══════════════════════════════════════════════

// Client → Server event codes (engine-level). PLAYER_INPUT and CHAT
// migrated off the engine event surface — input rides typed
// client-input frames (mmokit.HandleClient on channel 0x00 post
// Plan 1 Phase 5), and chat moved to its own service. The remaining
// codes service login + liveness, neither of which is HandleClient-
// eligible (CE_LOGIN runs inline on the gateway pre-cell, CE_PING is
// handled by the EventInterceptor on the read goroutine).
enum ClientEventCode {
    CE_UNKNOWN = 0;
    CE_PING = 1;
    CE_LOGIN = 2;
}

// Server → Client event codes (engine-level). Many former entries
// (SE_WORLD_UPDATE, SE_PONG, SE_LOGIN_REJECTED, SE_PLAYER_OWN_STATE,
// SE_DELTA_WORLD_UPDATE, SE_DEBUG_INFO) migrated to the typed-event
// channel (mmokit.RegisterEvent[T]) and no longer ride the
// proto-envelope path. The remaining codes service framework events
// that retain a proto payload (server config push, default spawn
// announce, cell-change hint).
enum ServerEventCode {
    SE_UNKNOWN = 0;
    SE_PLAYER_SPAWNED = 1;
    SE_CELL_CHANGE = 2;
    SE_SERVER_CONFIG = 3;      // engine config sent on connect (tick rate, etc.)
}

// ═══════════════════════════════════════════════
// ENTITY MESH STATE
// ═══════════════════════════════════════════════

// EntityMeshState describes an entity's ownership in the server mesh.
// Used by the MeshState replication binding — single source of truth for
// the wire values consumed by Go (pkg/system) and TypeScript (SDK) clients.
enum EntityMeshState {
    EMS_LOCAL   = 0; // authoritative on this node
    EMS_REPLICA = 1; // read-only copy from a neighboring node
    EMS_GHOST   = 2; // mid-transfer placeholder
}

// ═══════════════════════════════════════════════
// ENGINE EVENT PAYLOADS
// ═══════════════════════════════════════════════
//
// After Plan 1 Phase 7, only the framework events that retain a
// proto-envelope wire format (CE_PING, CE_LOGIN, SE_SERVER_CONFIG,
// SE_PLAYER_SPAWNED, SE_CELL_CHANGE) keep their proto payloads here.
// Migrated payloads (Pong, LoginRejected, DebugInfo, CellTopology,
// WorldDelta) live as Go structs in pkg/mmokit/event_messages.go and
// ride the typed reflection-codec channel.

message PingMsg {
    int64 client_time = 1;
}

message LoginMsg {
    string username = 1;
}

message CellChangeMsg {
    int32 cell_x = 1;
    int32 cell_y = 2;
}

message ServerConfigMsg {
    uint32 tick_rate = 1;
}

// Payload for SE_PLAYER_SPAWNED — tells the client its entity ID and world position.
message SpawnedMsg {
    uint32 entity_net_id = 1;
    float  world_x       = 2;
    float  world_y       = 3;
}
