syntax = "proto3";
package enginepb;
option go_package = "github.com/zenion/mmoserver/gen/go/enginepb";
option csharp_namespace = "Zenion.GameServer.Proto.Engine";

// ═══════════════════════════════════════════════
// ENVELOPES
// ═══════════════════════════════════════════════

message ClientEvent {
    uint32 code = 1;     // ClientEventCode identifying the event type
    bytes data = 2;      // serialized event-specific message
}

message ServerEvent {
    uint32 code = 1;     // ServerEventCode identifying the event type
    bytes data = 2;      // serialized event-specific message
}

// ═══════════════════════════════════════════════
// OPERATIONS — request/response, services (channel 0x01)
// ═══════════════════════════════════════════════

message OperationRequest {
    uint32 code = 1;         // OperationCode
    uint32 request_id = 2;   // client-assigned correlation ID, echoed in response
    bytes data = 3;          // serialized op-specific request
}

message OperationResponse {
    uint32 code = 1;         // OperationCode (echoed from request)
    uint32 request_id = 2;   // correlation ID (echoed, 0 = server-pushed notification)
    int32 return_code = 3;   // 0 = success, non-zero = error
    string error_msg = 4;    // human-readable error detail
    bytes data = 5;          // serialized op-specific response
}

// ═══════════════════════════════════════════════
// ENGINE EVENT CODES
// ═══════════════════════════════════════════════

// Client → Server event codes (engine-level)
enum ClientEventCode {
    CE_PLAYER_INPUT = 0;
    CE_PING = 1;
    CE_LOGIN = 2;
    CE_CHAT = 3;
    CE_ACK_SNAPSHOT = 4;    // client ack: data = uint32 big-endian sequence number
}

// Server → Client event codes (engine-level)
enum ServerEventCode {
    SE_WORLD_UPDATE = 0;
    SE_PLAYER_SPAWNED = 1;
    SE_PONG = 2;
    SE_LOGIN_REJECTED = 3;
    SE_CHAT = 10;
    SE_PLAYER_OWN_STATE = 11;
    SE_CELL_CHANGE = 12;
    SE_DELTA_WORLD_UPDATE = 13;  // binary delta-compressed world update
    SE_DEBUG_INFO = 14;         // debug overlay data (per-player gated)
    SE_SERVER_CONFIG = 15;      // engine config sent on connect (tick rate, etc.)
}

// ═══════════════════════════════════════════════
// ENTITY MESH STATE
// ═══════════════════════════════════════════════

// EntityMeshState describes an entity's ownership in the server mesh.
// Used by the MeshState replication binding — single source of truth for
// the wire values consumed by Go (pkg/system) and TypeScript (SDK) clients.
enum EntityMeshState {
    EMS_LOCAL   = 0; // authoritative on this node
    EMS_REPLICA = 1; // read-only copy from a neighboring node
    EMS_GHOST   = 2; // mid-transfer placeholder
}

// ═══════════════════════════════════════════════
// ENGINE EVENT PAYLOADS
// ═══════════════════════════════════════════════

message PingMsg {
    int64 client_time = 1;
}

message PongMsg {
    int64 client_time = 1;
    int64 server_time = 2;
}

message LoginMsg {
    string username = 1;
}

message LoginRejectedMsg {
    string reason = 1;
}

message ChatMsg {
    string username = 1;
    string text = 2;
}

message CellChangeMsg {
    int32 cell_x = 1;
    int32 cell_y = 2;
}

message ServerConfigMsg {
    uint32 tick_rate = 1;
}

// Payload for SE_PLAYER_SPAWNED — tells the client its entity ID and world position.
message SpawnedMsg {
    uint32 entity_net_id = 1;
    float  world_x       = 2;
    float  world_y       = 3;
}

// Describes a single cell in the server mesh topology.
message CellInfo {
    int32  cell_x   = 1;
    int32  cell_y   = 2;
    uint32 depth    = 3;
    float  size     = 4;
    float  origin_x = 5;
    float  origin_y = 6;
    string node_id  = 7;
}

// Cell layout for debug/dynamic partitioning. Embedded inside
// DebugInfoMsg.topology when shipped to debug-enabled players via
// SE_DEBUG_INFO.
message CellTopologyMsg {
    repeated CellInfo cells = 1;
    int32 grid_w            = 2;
    int32 grid_h            = 3;
    float base_cell_size    = 4;
}

// Payload for SE_DEBUG_INFO — per-player debug overlay data, sent
// only to players whose DebugFlags has the corresponding bit set.
// Each field is gated by a specific DebugFlag; the server only
// populates fields the player has enabled. Future debug capabilities
// slot in as new optional fields without breaking the gate or the
// client decoder.
message DebugInfoMsg {
  optional CellTopologyMsg topology = 1;     // gated by DebugTopology
  optional float aoi_radius = 2;             // gated by DebugTopology (paired)
}
