syntax = "proto3";
package gamepb;
option go_package = "github.com/zenion/mmoserver/gen/go/gamepb";
option csharp_namespace = "Zenion.GameServer.Proto";

// ═══════════════════════════════════════════════
// GAME-SPECIFIC EVENT CODES
// ═══════════════════════════════════════════════
//
// Plan 1 Phase 7 retired every GSE_* code: each game-specific server
// event migrated to a typed reflection-codec frame (mmokit.RegisterEvent[T]
// + internal/game/event_messages.go). The enum is retained as a
// placeholder for future non-typed game-specific client codes.

enum GameClientEventCode {
    GCE_UNKNOWN = 0;
}

enum GameServerEventCode {
    GSE_UNKNOWN = 0;
}

// ═══════════════════════════════════════════════
// GAME-SPECIFIC ENUMS
// ═══════════════════════════════════════════════

enum EntityType {
    ENTITY_TYPE_SHIP = 0;
    ENTITY_TYPE_ASTEROID = 1;
    ENTITY_TYPE_PROJECTILE = 2;
    ENTITY_TYPE_STATION = 3;
    ENTITY_TYPE_LOOT_CRATE = 4;
    ENTITY_TYPE_NPC = 5;
}

// ═══════════════════════════════════════════════
// OPERATIONS
// ═══════════════════════════════════════════════

enum OperationCode {
    OP_MARKET_BROWSE = 0;
    OP_MARKET_CREATE_ORDER = 1;
    OP_MARKET_CANCEL_ORDER = 2;
    OP_MARKET_MY_ORDERS = 3;
    OP_MARKET_INSTANT_TRADE = 4;
}

// === Marketplace operation payloads ===

// Request payloads (serialized into OperationRequest.data)
message MarketBrowseRequest { uint32 item_id = 1; }
message MarketCreateOrderRequest {
    uint32 item_id = 1; bool is_buy = 2;
    int64 price_per_unit = 3; int32 quantity = 4;
}
message MarketCancelOrderRequest { uint64 order_id = 1; }
message MarketMyOrdersRequest {}
message MarketInstantTradeRequest {
    uint32 item_id = 1; bool is_buy = 2; int32 quantity = 3;
}

// Response payloads (serialized into OperationResponse.data)
message MarketOrderBookResponse {
    uint32 item_id = 1;
    repeated MarketPriceLevel sell_levels = 2;
    repeated MarketPriceLevel buy_levels = 3;
}
message MarketPriceLevel { int64 price = 1; int32 quantity = 2; uint32 order_count = 3; }
message MarketOrderResultResponse {
    uint64 order_id = 1; int32 filled_qty = 2;
    int64 avg_price = 3; int64 total_cost = 4;
}
message MarketMyOrdersResponse { repeated MarketOrderEntry orders = 1; }
message MarketOrderEntry {
    uint64 order_id = 1; uint32 item_id = 2; bool is_buy = 3;
    int64 price_per_unit = 4; int32 quantity = 5; int32 orig_quantity = 6;
    int64 created_at = 7; int64 expires_at = 8;
}

// Push notification payload (OperationResponse with request_id=0)
message MarketTradeNotification {
    uint64 order_id = 1; uint32 item_id = 2;
    int32 filled_qty = 3; int64 price = 4;
    bool you_sold = 5; int64 currency_change = 6; uint32 currency_id = 7;
}
