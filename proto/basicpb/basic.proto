syntax = "proto3";
package basicpb;
option go_package = "github.com/zenion/mmoserver/gen/go/basicpb";

// Echo demo service operations. Validates the pluggable services framework
// end-to-end: ping returns the handling instance ID (visualizes hash-affinity
// routing), persist + fetch round-trip a row through Postgres (visualizes
// cross-instance DB consistency).
enum EchoOpCode {
    BOP_ECHO_UNSPECIFIED = 0;
    BOP_ECHO_PING        = 300;
    BOP_ECHO_PERSIST     = 301;
    BOP_ECHO_FETCH       = 302;
}

message EchoPingRequest    { string msg = 1; }
message EchoPingResponse   { string msg = 1; string instance_id = 2; }
message EchoPersistRequest { string key = 1; string value = 2; }
message EchoPersistResponse{ bool   ok  = 1; string instance_id = 2; }
message EchoFetchRequest   { string key = 1; }
message EchoFetchResponse  { string value = 1; int64 found_at_ms = 2; string instance_id = 3; }
