syntax = "proto3";
package gamepb;
option go_package = "github.com/zenion/mmoserver/gen/go/gamepb";
option csharp_namespace = "Zenion.GameServer.Proto";

// === Enums ===

enum EntityType {
    ENTITY_TYPE_SHIP = 0;
    ENTITY_TYPE_ASTEROID = 1;
    ENTITY_TYPE_PROJECTILE = 2;
    ENTITY_TYPE_STATION = 3;
    ENTITY_TYPE_LOOT_CRATE = 4;
    ENTITY_TYPE_NPC = 5;
}

enum ResourceType {
    RESOURCE_TYPE_ORE = 0;
    RESOURCE_TYPE_CRYSTAL = 1;
    RESOURCE_TYPE_GAS = 2;
    RESOURCE_TYPE_METAL = 3;
}

enum StatusEffectType {
    STATUS_EFFECT_NONE = 0;
    STATUS_EFFECT_ION_BURN = 1;
    STATUS_EFFECT_FORTIFIED = 2;
    STATUS_EFFECT_AFTERBURNER = 3;
}

enum EquipSlot {
    EQUIP_SLOT_NONE = 0;
    EQUIP_SLOT_WEAPON1 = 1;
    EQUIP_SLOT_WEAPON2 = 2;
    EQUIP_SLOT_SHIELD = 3;
    EQUIP_SLOT_THRUSTER = 4;
}

// === Inventory & Equipment ===

message InventoryItem {
    uint32 item_id = 1;
    float quantity = 2;
}

message ItemDefMsg {
    uint32 id = 1;
    string name = 2;
    float mass_per_unit = 3;
    float sell_price = 4;
    uint32 category = 5;        // ItemCategory enum value
    uint32 equip_slot = 6;      // EquipSlot (0 = not equippable)
    float buy_price = 7;        // FLUX cost at station shop (0 = not purchasable)
}

message EquipmentState {
    uint32 weapon1 = 1;
    uint32 weapon2 = 2;
    uint32 shield = 3;
    uint32 thruster = 4;
}

// === Envelope messages ===

// Client -> Server
message ClientMessage {
    oneof msg {
        PlayerInputMsg input = 1;
        PingMsg ping = 2;
        RespawnRequestMsg respawn = 3;
        LoginMsg login = 4;
        ChatMsg chat = 5;
        InventoryTransferMsg transfer = 6;
        BankRequestMsg bank_request = 7;
        SellBankItemMsg sell_bank_item = 8;
        EquipRequestMsg equip_request = 9;
        ShopBuyMsg shop_buy = 10;
        DockRequestMsg dock_request = 11;
        UndockRequestMsg undock_request = 12;
    }
}

// Server -> Client
message ServerMessage {
    oneof msg {
        WorldUpdateMsg world_update = 1;
        PlayerSpawnedMsg player_spawned = 2;
        PongMsg pong = 3;
        PlayerDiedMsg player_died = 4;
        // field 5 was SellResultMsg sell_result (removed)
        LoginRejectedMsg login_rejected = 6;
        AbilityCastResultMsg ability_result = 7;
        BankContentsMsg bank_contents = 8;
        TransferResultMsg transfer_result = 9;
        EquipResultMsg equip_result = 10;
        DockingStateMsg docking_state = 11;
        DockedMsg docked = 12;
    }
}

// === Client messages ===

message PlayerInputMsg {
    float thrust = 1;           // legacy, unused
    float turn = 2;             // legacy, unused
    bool fire = 3;              // legacy, unused
    bool mine = 4;              // legacy: mining now via ability_cast
    uint32 sequence = 5;
    uint32 target_id = 6;       // legacy: mining target now via lock_target_id
    uint32 jettison = 7;        // item ID to jettison (0 = none)
    // field 8 was bool sell (removed)
    float move_x = 9;           // right-click destination X
    float move_y = 10;          // right-click destination Y
    bool move_active = 11;      // true when player issued a move command
    uint32 ability_cast = 12;   // bitmask: bit 0=Q, 1=W, 2=E, 3=R, 4=D, 5=F
    uint32 lock_target_id = 13; // lock-on target network ID, 0 = none
}

message PingMsg {
    int64 client_time = 1;
}

message RespawnRequestMsg {}

message LoginMsg {
    string username = 1;
}

message InventoryTransferMsg {
    uint32 item_id = 1;
    float quantity = 2;     // amount to transfer (0 = all)
    bool deposit = 3;       // true = cargo->bank, false = bank->cargo
}

message BankRequestMsg {}

message SellBankItemMsg {
    uint32 item_id = 1;
    float quantity = 2;     // amount to sell (0 = sell all)
}

message EquipRequestMsg {
    uint32 item_id = 1;    // item to equip (0 = unequip)
    EquipSlot slot = 2;    // which slot to affect
}

message ShopBuyMsg {
    uint32 item_id = 1;
    uint32 quantity = 2;   // number to buy (usually 1 for equipment)
}

message DockRequestMsg {}

message UndockRequestMsg {}

// === Server messages ===

message WorldUpdateMsg {
    uint32 tick = 1;
    uint32 ack_input_seq = 2;
    repeated EntityState entities = 3;
    repeated uint32 removed_ids = 4;       // left AoI (no visual effect)
    repeated ChatMsg chat_messages = 5;
    repeated uint32 killed_ids = 6;        // actually died/destroyed (play explosion)
    repeated AbilityCastResultMsg ability_events = 7; // ability casts visible in AoI
}

message ChatMsg {
    string username = 1;
    string text = 2;
}

message EntityState {
    uint32 id = 1;
    EntityType entity_type = 2;
    float x = 3;
    float y = 4;
    float vx = 5;
    float vy = 6;
    float rotation = 7;
    float health = 8;    // current HP
    float max_health = 31; // maximum HP
    float shield = 9;    // current shield
    float max_shield = 32; // maximum shield
    float radius = 10;
    float width = 12;    // rect hitbox width (forward), 0 for circles
    float height = 13;   // rect hitbox height (side), 0 for circles
    optional uint32 owner_id = 11;
    repeated float resources = 14;          // deprecated: old fixed cargo array
    bool mining_active = 15;                // true if mining laser is firing
    uint32 mining_target_id = 16;           // network ID of mining target
    ResourceType resource_type = 17;        // minable resource type
    float resource_remaining = 18;          // minable resource remaining
    // field 19 was float flux (removed)
    string pilot_name = 20;                  // player username (ships only)
    float lock_progress = 21;                // 0-1 lock-on progress (own entity only)
    uint32 lock_target_id = 22;              // locked target net ID (own entity only)
    repeated AbilityCooldownState ability_cooldowns = 23; // cooldowns (own entity only)
    repeated ActiveStatusEffect status_effects = 24;      // buffs/debuffs (all entities)
    uint32 locked_by_id = 25;                              // net ID of most-progressed locker (0 = none)
    float  locked_by_progress = 26;                        // 0-1 lock progress of that locker
    repeated InventoryItem cargo_items = 27;               // item-based cargo inventory
    float cargo_mass = 28;                                 // current total cargo mass
    float max_cargo_mass = 29;                             // cargo capacity
    EquipmentState equipment = 30;                         // equipped items (own entity only)
    uint32 mining_beam_mask = 33;                           // bitmask: bit0=weapon1 beam, bit1=weapon2 beam
}

message PlayerSpawnedMsg {
    uint32 your_entity_id = 1;
    float world_width = 2;
    float world_height = 3;
    // field 4 was repeated float sell_prices (removed)
    repeated ItemDefMsg item_defs = 5;      // full item registry
    EquipmentState equipment = 6;           // your current equipment
}

message PlayerDiedMsg {
    uint32 killer_id = 1; // network ID of who killed you, 0 if unknown
}

message PongMsg {
    int64 client_time = 1;
    int64 server_time = 2;
}

message LoginRejectedMsg {
    string reason = 1;
}

message BankContentsMsg {
    repeated InventoryItem items = 1;
    float total_mass = 2;
    float max_mass = 3;
    repeated InventoryItem cargo_items = 4;
    float cargo_mass = 5;
    float max_cargo_mass = 6;
}

message TransferResultMsg {
    bool success = 1;
    string reason = 2;
    uint32 item_id = 3;
    float quantity = 4;     // actual amount transferred
    bool deposit = 5;       // direction of transfer
}

message EquipResultMsg {
    bool success = 1;
    string reason = 2;
    EquipSlot slot = 3;
    uint32 equipped_item_id = 4;  // 0 if slot is now empty
    uint32 previous_item_id = 5;  // what was in the slot before
}

message AbilityCooldownState {
    uint32 slot = 1;      // 0=Q, 1=W, 2=E, 3=R, 4=D, 5=F
    float remaining = 2;  // seconds remaining
    float total = 3;      // total cooldown duration
}

message ActiveStatusEffect {
    StatusEffectType type = 1;
    float remaining = 2;  // seconds remaining
}

message DockingStateMsg {
    bool docking = 1;        // true = docking in progress, false = cancelled
    float progress = 2;      // 0.0 to 1.0
    float total_time = 3;    // total docking duration (for client progress bar)
    uint32 station_id = 4;   // net ID of station being docked at (for tractor beam VFX)
}

message DockedMsg {}

message AbilityCastResultMsg {
    uint32 slot = 1;
    bool success = 2;
    string reason = 3;       // failure reason if !success
    uint32 target_id = 4;    // target hit
    float damage_dealt = 5;  // actual damage dealt
    uint32 caster_id = 6;    // network ID of caster (for broadcast)
    uint32 ability_type = 7;  // AbilityType enum from item.go (drives client VFX/SFX)
}
