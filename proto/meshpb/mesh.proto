syntax = "proto3";
package meshpb;
option go_package = "github.com/zenion/mmoserver/gen/go/meshpb";
option csharp_namespace = "Zenion.GameServer.Proto.Mesh";

// ═══════════════════════════════════════════════
// MeshControl — coordinator <-> hosts, coordinator <-> gateway
// Defined for S4. S3 does not implement the server, but generated
// stubs must exist so S4 can land without regenerating protos.
// ═══════════════════════════════════════════════

service MeshControl {
  rpc Control(stream HostMessage) returns (stream CoordMessage);
}

message HostMessage {
  oneof msg {
    RegisterHost      register            = 1;
    Heartbeat         heartbeat           = 2;
    CellReady         cell_ready          = 3;
    CellStopped       cell_stopped        = 4;
    SplitComplete     split_complete      = 5;
    MergeComplete     merge_complete      = 6;
    PersistBatch      persist_batch       = 8;
    PlayerHandoff     player_handoff      = 9;
    RegisterGateway   register_gateway    = 10;
    SessionAnnounce   session_announce    = 11;
    PlayerMigrated    player_migrated     = 12;
    GracefulLeave     graceful_leave      = 13;
    CellTransferReady cell_transfer_ready = 14;  // S7: target host → coord completion ack
    CommandResponse   command_response    = 15;  // C3: host → coord command result
    CommandRequest    command_request     = 16;  // C3: host → coord (coord-routed verbs)
    ResolveSpawn      resolve_spawn       = 17;  // S9: gateway → coord spawn resolver RPC
    HostOpAck         host_op_ack         = 18;
    ServiceAnnounce   service_announce    = 19;  // service framework: host → coord new service instance
    ServiceLeave      service_leave       = 20;  // service framework: host → coord service instance going away
  }
}

message CoordMessage {
  uint64 coord_epoch = 200;

  oneof msg {
    RegisterAck       register_ack        = 1;
    CellAssign        cell_assign         = 2;
    CellRelease       cell_release        = 3;
    PeerList          peer_list           = 8;
    NetIDRangeGrant   netid_range         = 9;
    PersistResult     persist_result      = 10;
    UpstreamSwitch    upstream_switch     = 11;
    CellsDrained      cells_drained       = 12;
    CellTransfer      cell_transfer       = 13;  // S7: coord → source host to start transfer
    CellTransferAbort cell_transfer_abort = 14;  // S7: coord → target host to drop partial
    CommandRequest    command_request     = 15;  // C3: coord → host command dispatch
    CommandResponse   command_response    = 16;  // C3: coord → caller forwarded response
    CommandCancel     command_cancel      = 17;  // C3: coord → host cancel in-flight handler
    SpawnResolved     spawn_resolved      = 18;  // S9: coord → gateway spawn resolver response
    SessionRegister   session_register    = 19;  // S9: coord → host VCM session registration
    CellRename        cell_rename         = 20;  // Phase 4: coord → host merge survivor rename
    CoordTimeSync     coord_time_sync     = 21;  // Replication Timeline Redesign: cluster-clock advisory refresh
  }
}

// MeshControl message bodies — stubbed for S4. Each gets the MINIMUM
// fields needed to be a valid proto message. S4 will fill in additional
// fields as needed.

message RegisterHost {
  string host_id        = 1;
  string grpc_addr      = 2;
  bool   has_player_db  = 3;
}

message Heartbeat {
  string host_id = 1;
  uint64 tick    = 2;
}

message CellReady {
  string host_id = 1;
  string cell_id = 2;
}

message CellStopped {
  string host_id = 1;
  string cell_id = 2;
}

message SplitComplete {
  string host_id        = 1;
  string parent_cell_id = 2;
  repeated string child_cell_ids = 3;
}

message MergeComplete {
  string host_id           = 1;
  string survivor_cell_id  = 2;
  repeated string donor_cell_ids = 3;
}

message PersistBatch {
  string host_id = 1;
  bytes  payload = 2;  // opaque persistence payload
}

message PlayerHandoff {
  string host_id      = 1;
  uint32 conn_id      = 2;
  string username     = 3;
  string dest_cell_id = 4;
}

// S6: gateway registration on a MeshControl stream.
message RegisterGateway {
  string gateway_id = 1;
  string ws_addr    = 2;
  string grpc_addr  = 3;
}

// S6: gateway tells coordinator that a player session is on this gateway.
// Fire-and-forget — no ack; coordinator reconciles from the next PeerList on loss.
message SessionAnnounce {
  string gateway_id     = 1;
  uint32 conn_id        = 2;
  string username       = 3;
  string target_host_id = 4;
  string target_cell_id = 5;
}

// S6: handoff-source node tells coordinator about a cross-host entity migration.
// Fire-and-forget — no ack; coordinator reconciles from the next PeerList on loss.
message PlayerMigrated {
  string gateway_id   = 1;
  uint32 conn_id      = 2;
  string from_host_id = 3;
  string to_host_id   = 4;
  string to_cell_id   = 5;
}

message RegisterAck {
  bool   ok        = 1;
  string reason    = 2; // empty on success
  uint32 host_idx  = 3;
}

message CellAssign {
  string cell_id = 1;
}

message CellRelease {
  string cell_id = 1;
  uint64 req_id  = 2;  // 0 = fire-and-forget (back-compat with bookkeeping); non-zero = expect HostOpAck
}

message CellRename {
  string from_cell_id = 1;
  string to_cell_id   = 2;
  uint64 req_id       = 3;
}

message PeerList {
  repeated HostRecord    hosts    = 1;
  repeated CellOwnership cells    = 2;
  repeated GatewayRecord gateways = 3;
  repeated ServiceRecord services = 4;
}

message CellOwnership {
  string cell_id = 1;
  string host_id = 2;
}

message HostRecord {
  string host_id        = 1;
  string grpc_addr      = 2;
  bool   has_player_db  = 3;
}

message GatewayRecord {
  string gateway_id = 1;
  string grpc_addr  = 2;
}

// ServiceRecord describes a single live service instance in the cluster.
// Service kinds are game-defined; the engine treats them opaquely.
message ServiceRecord {
  string kind                = 1;  // e.g. "chat", "market"
  string instance_id         = 2;  // unique within cluster (typically "<host>-<kind>-<n>")
  string host_id             = 3;  // joins HostRecord.host_id for grpc_addr lookup
  repeated uint32 op_codes   = 4;  // op codes this instance handles
}

// ServiceAnnounce — host informs coordinator that a service instance has
// just started serving. Coordinator validates op-code uniqueness and
// adds the instance to the cluster registry, then re-broadcasts PeerList.
message ServiceAnnounce {
  string kind                = 1;
  string instance_id         = 2;
  string host_id             = 3;
  repeated uint32 op_codes   = 4;
}

// ServiceLeave — host informs coordinator that a service instance has
// stopped or is shutting down. Coordinator removes it from the registry
// and re-broadcasts PeerList. Idempotent: unknown instance_id is a no-op.
message ServiceLeave {
  string instance_id = 1;
}

message NetIDRangeGrant {
  string host_id = 1;
  uint32 start   = 2;
  uint32 count   = 3;
}

message PersistResult {
  bool   ok     = 1;
  string reason = 2;
}

message UpstreamSwitch {
  string gateway_id  = 1;
  uint32 conn_id     = 2;
  string new_host_id = 3;
  uint64 new_epoch   = 4;
  // new_cell_id is the session's authoritative cell after this switch.
  // Non-empty when cell changes (split, merge). Empty when only the host
  // changes and the cellID stays the same (migrate).
  string new_cell_id = 5;
}

// S7: host announces it is preparing to leave the cluster. The coordinator
// drains every cell assigned to this host (via split / merge / migrate as
// appropriate) and replies with CellsDrained when the host owns zero cells.
message GracefulLeave {
  string host_id = 1;
}

// S7: coordinator acknowledges a GracefulLeave once every cell previously
// owned by host_id has been drained. The host can then shut down safely.
message CellsDrained {
  string host_id = 1;
}

// Replication Timeline Redesign: coordinator broadcasts its local
// wall-clock-ms over MeshControl to every registered host. Each host's
// ClusterClock uses this to maintain an EMA-smoothed offset so every
// replication sample — regardless of authoring cell — is stamped on
// a cluster-coherent timeline.
//
// Period: Config.ClusterClockSyncInterval (default 10 s). Never on the
// per-tick path; purely advisory refresh. The initial CoordTimeSync is
// sent immediately after RegisterAck — remote hosts block cell-worker
// startup until ClusterClock.Observed() returns true.
//
// seq is monotonic per broadcast; hosts drop stale-seq arrivals.
message CoordTimeSync {
  uint64 coord_time_ms = 1;
  uint64 seq           = 2;
}

// ═══════════════════════════════════════════════
// C3 — cross-process command dispatch messages
// ═══════════════════════════════════════════════

message CommandRequest {
  uint64 request_id          = 1;
  string verb                = 2;
  bytes  args_json           = 3;
  Caller caller              = 4;
  int64  deadline_unix_nanos = 5;
  string trace_id            = 6;
  uint64 schema_version      = 7;  // FNV-64a of the caller's ArgsSchemaHash
}

message CommandResponse {
  uint64 request_id     = 1;
  bool   ok             = 2;
  bytes  result_json    = 3;
  string error          = 4;
  string detail         = 5;  // human-readable detail for audit log
  string target_id      = 6;  // who answered (e.g. "node-2")
  uint64 schema_version = 7;  // receiver's ResultSchemaHash
}

message CommandCancel {
  uint64 request_id = 1;
  string reason     = 2;  // "caller_context_canceled", "deadline_exceeded"
}

message Caller {
  string          id     = 1;
  uint32          source = 2;  // CallerSource enum (Console=0, MeshControl=1, Test=2)
  repeated Grant  grants = 3;
}

message Grant {
  string pattern = 1;
  bool   allow   = 2;
}

// ═══════════════════════════════════════════════
// MeshData — host <-> host, gateway <-> host
// Fully wired in S3.
// ═══════════════════════════════════════════════

service MeshData {
  rpc Data(stream MeshFrame) returns (stream MeshFrame);
}

// MeshFrame wraps every variant in a single oneof. dest_cell_id is a
// TOP-LEVEL field (outside the oneof, number 100) so receivers can route
// frames to the target cell before dispatching on the variant.
message MeshFrame {
  string dest_cell_id = 100;

  oneof msg {
    BorderFrame       border_frame        = 1;
    Handoff           handoff             = 2;  // Replication Timeline Redesign: single-message hard-cut handoff
    ForwardInput      forward_input       = 3;
    CellTransfer      cell_transfer       = 4;  // S7: unified split/merge/migrate
    CellTransferReady cell_transfer_ready = 5;  // S7: target-host ack
    CellTransferAbort cell_transfer_abort = 6;  // S7: orchestrator-driven rollback
    ClientInput       client_input        = 7;
    ClientFrame       client_frame        = 8;
    ChatRelay         chat_relay          = 9;
    CrossCellAction   cross_action        = 10;
    ActionResult      action_result       = 11;
    PlayerAssignment  player_assignment   = 12;
    SessionTransfer   session_transfer    = 13;
    SpawnTransfer     spawn_transfer      = 14;
    ClientDisconnect  client_disconnect   = 15; // S6: pair with client_input/client_frame — graceful disconnect
  }
}

// BorderFrame carries a replication delta frame from the sender cell to
// a neighbor cell. data is the encoded pkg/replication.Frame bytes.
message BorderFrame {
  string from_cell_id = 1;
  bytes  data         = 2;
}

// Handoff is the single authority-transfer message. Replaces
// HandoffPrepare + HandoffCommit + HandoffCancel from the overlap
// model. Source sends one per crossing event; destination commits at
// commit_tick (cluster-tick number; see ClusterClock).
//
// transfer_blob carries the full entity state only when the
// destination does not already have a border-replica for net_id
// (fast-mover or spawn-across-boundary case). When the destination
// does have a replica, blob is nil and destination's promote path
// reuses the cached state.
message Handoff {
  string from_cell_id  = 1;
  uint32 net_id        = 2;
  uint32 epoch         = 3;
  uint64 commit_tick   = 4;
  bytes  transfer_blob = 5; // optional; empty when dest has replica
  uint32 conn_id       = 6; // 0 for non-player entities
}

// ForwardInput carries an input frame that arrived at the old owner
// during the single-tick overlap window after a HandoffCommit.
message ForwardInput {
  string from_cell_id = 1;
  uint32 conn_id      = 2;
  bytes  input_blob   = 3;
  string gateway_id   = 4; // gateway_id + conn_id forms the composite session key
}

// CrossCellAction mirrors pkg/universe/action.go CrossCellAction.
message CrossCellAction {
  string from_cell_id   = 1;
  uint32 action_type    = 2;  // ActionType (uint16) widened for proto
  uint32 target_net_id  = 3;
  uint32 source_net_id  = 4;
  string source_cell_id = 5;
  bytes  payload        = 6;
}

// ActionResult mirrors pkg/universe/action.go ActionResult.
message ActionResult {
  string from_cell_id = 1;
  uint32 action_type  = 2;
  uint32 target_net_id = 3;
  uint32 source_net_id = 4;
  bool   success      = 5;
  bytes  payload      = 6;
  bytes  side_effects = 7;
}

// ChatRelay mirrors pkg/universe/message.go ChatRelay.
message ChatRelay {
  string from_cell_id = 1;
  string username     = 2;
  string text         = 3;
}

// Location is the wire form of coords.Location — world-space anchor for
// spawn/respawn/teleport targets.
message Location {
  float  x      = 1;
  float  y      = 2;
  float  facing = 3; // radians, 0 = +X axis
  string tag    = 4; // game-defined
}

// PlayerAssignment mirrors pkg/universe/message.go PlayerAssignment.
// The auth service stamps user_id (UUID) + session_token at login time;
// downstream cell wiring keys player records by user_id, not username.
message PlayerAssignment {
  string   from_cell_id    = 1;
  string   to_cell_id      = 2;
  uint32   conn_id         = 3;
  string   gateway_id      = 4;
  string   user_id         = 5;
  string   username        = 6;
  string   session_token   = 7;
  bool     is_reconnect    = 8;
  uint64   epoch           = 9;
  Location spawn_location  = 10;
}

// SessionTransfer mirrors pkg/universe/message.go SessionTransfer.
message SessionTransfer {
  string from_cell_id = 1;
  uint32 conn_id      = 2;
  string username     = 3;
  string state_tag    = 4;
  bytes  data         = 5;
}

// SpawnTransfer mirrors pkg/universe/message.go SpawnTransfer.
message SpawnTransfer {
  string   from_cell_id   = 1;
  uint32   conn_id        = 2;
  string   username       = 3;
  Location spawn_location = 4;
}

// ═══════════════════════════════════════════════
// S7 — unified cell transfer: one message carries split, merge, and live
// migration payloads. The orchestrator stamps a request_id, the target host
// replies with CellTransferReady, and CellTransferAbort lets the orchestrator
// roll back a partial transfer.
// ═══════════════════════════════════════════════

// S7: unified cell state transfer. Covers split (parent -> new child),
// merge (donor -> survivor), and live migrate (src host -> dest host, same
// cell ID). Entities + sessions are packed as length-prefixed records.
message CellTransfer {
  uint64           request_id   = 1;  // orchestrator-assigned, correlates with CellTransferReady
  CellTransferKind kind         = 2;  // SPLIT | MERGE | MIGRATE
  string           src_cell_id  = 3;  // split: parent; merge: donor; migrate: same as dest
  string           dest_cell_id = 4;  // split: child; merge: survivor; migrate: same as src
  string           dest_host_id = 5;  // target host for dest cell (empty = stay local)
  uint32           quadrant     = 6;  // split only: 0=BL, 1=BR, 2=TL, 3=TR
  uint64           src_epoch    = 7;  // parent/donor/source epoch at serialization time
  bytes            entities     = 8;  // packed TransferFrame records, length-prefixed
  bytes            sessions     = 9;  // packed SessionTransfer records
  CellBounds       bounds       = 10; // world-space bounds of dest cell
}

enum CellTransferKind {
  CELL_TRANSFER_UNSPECIFIED = 0;
  CELL_TRANSFER_SPLIT       = 1;
  CELL_TRANSFER_MERGE       = 2;
  CELL_TRANSFER_MIGRATE     = 3;
}

// S7: world-space axis-aligned bounds of a cell. Used to scope the destination
// cell on a split/merge/migrate without recomputing from CellID.
message CellBounds {
  float min_x = 1;
  float min_y = 2;
  float max_x = 3;
  float max_y = 4;
}

// S7: target host acknowledges a CellTransfer. ok=false + error means the
// orchestrator must roll back; ok=true commits the new ownership.
message CellTransferReady {
  uint64 request_id   = 1;
  string dest_cell_id = 2;
  string host_id      = 3;
  bool   ok           = 4;
  string error        = 5;
  // Usernames whose entities landed on this dest cell during populateCell.
  // Used by applySplitCommit to route each player's session to the child
  // that actually received their entity (instead of a blind fallback to
  // children[0]).
  repeated string adopted_users = 6;
}

// S9: gateway → coord spawn resolver request. The gateway allocates a request_id;
// the coordinator runs the registered SpawnResolver and replies with SpawnResolved.
message ResolveSpawn {
  uint64 request_id = 1;
  string gateway_id = 2;
  uint32 conn_id    = 3;
  string username   = 4;
}

// host → coord ack for coordinator-initiated cell operations (CellRelease etc.).
// req_id matches the req_id stamped on the originating CoordMessage. ok=false
// means the operation failed; error is a human-readable description.
message HostOpAck {
  uint64 req_id = 1;
  bool   ok     = 2;
  string error  = 3;
}

// S9: coord → gateway spawn resolver response. ok=false means no saved
// position (use Config.DefaultSpawn). error is non-empty when the RPC itself
// failed (e.g. no resolver registered).
message SpawnResolved {
  uint64 request_id = 1;
  bool   ok         = 2;
  float  world_x    = 3;
  float  world_y    = 4;
  string error      = 5;
}

// S9: coordinator tells a remote host to register (or update) a player
// session in its VirtualConnManager with the correct epoch. Dispatched
// after epoch bump in notifyPlayerMigrated (boundary crossing) and
// applyMigrateCommit (cell migrate).
message SessionRegister {
  string gateway_id = 1;
  uint32 conn_id    = 2;
  string username   = 3;
  uint64 epoch      = 4;
  string cell_id    = 5;
}

// S7: orchestrator instructs a target host to discard a CellTransfer that
// has not yet committed. Sent as part of rollback on timeout or error.
message CellTransferAbort {
  uint64 request_id = 1;
}

// ═══════════════════════════════════════════════
// S6 — MeshData gateway client traffic (data plane).
// ═══════════════════════════════════════════════

// S6: raw client input bytes forwarded from gateway to host.
message ClientInput {
  uint32 conn_id    = 1;
  bytes  data       = 2;
  string gateway_id = 3;
  uint64 epoch      = 4;
}

// S6: raw client frame bytes forwarded from host to gateway.
message ClientFrame {
  uint32 conn_id    = 1;
  bytes  data       = 2;
  string gateway_id = 3;
  uint64 epoch      = 4;
}

// S6: client graceful disconnect notification from gateway to host.
message ClientDisconnect {
  string gateway_id = 1;
  uint32 conn_id    = 2;
  string reason     = 3;
}
