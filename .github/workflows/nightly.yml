# Scheduled-only gates. These never run on the PR path.
#
# Both jobs here are slow enough or noisy enough that putting them in front of a
# merge would train everyone to ignore them. `ci.yml` is the required set.
#
# Both jobs cover the whole repository, examples included. The note that used
# to sit here described an mmokit-core extraction that was reversed: the space
# game ships as examples/space/ rather than staying unpublished, so there is no
# published/unpublished split for these jobs to respect.
#
# This is also where the unshortened `go test` lives. ci.yml runs it with
# -short so examples/4node-basic's suspected-flaky mesh e2e stays off the
# required path; it runs here, under -race, where a red is investigated.
#
# Action versions are pinned to the same majors as ci.yml — see the note there
# before bumping either file.

name: Nightly

on:
  schedule:
    # 03:17 UTC. Off the hour so this does not queue behind the very large
    # number of workflows that ask for exactly 0 * * * *.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race:
    name: race
    runs-on: ubuntu-latest
    # Measured locally at 2 m 55 s against 48 s for the same suite without
    # -race. A hosted runner has fewer cores, so budget generously.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # This job is expected to be green: unit 3 fixed the deterministic
      # pkg/admin failure that made it red (sseWriter.Deliver flushing the
      # handler's http.ResponseWriter from the TopicBus dispatcher goroutine
      # after handleStream had returned) and rewrote the timing-dependent
      # TestTopicBus_SlowSubscriberDropped. Two full -race runs passed
      # afterwards, so this is NOT marked continue-on-error — a race gate that
      # is allowed to fail is a race gate nobody reads.
      #
      # Two known unknowns rather than proven-green claims. The
      # ensureBorderDispatcher vs applyPeerList cell-bridge race recorded in
      # docs/roadmap.md §6.7 did not reproduce, and is recorded there as
      # unreproducible rather than fixed. And
      # examples/4node-basic TestE2EMeshSplitMergeWithBotTraffic is a suspected
      # pre-existing nondeterministic flake. Do not assume a perfect first
      # month; investigate a failure here, do not re-run it away.
      #
      # `-p 1` carries over from ci.yml for a stronger reason than it has
      # there: the serialize-timeout it insures against is CPU contention on a
      # RunOnLoop deadline, and -race makes contention strictly worse.
      #
      # The run is teed so the next step can answer the ONE question that
      # decides how urgent a red is — was it a data race, or a flaky test?
      # Without that split every failure costs a log-archaeology session, and
      # the known flakes below make that a recurring cost.
      - name: go test -race
        id: race
        run: |
          set -o pipefail
          go test -race ./... -count=1 -p 1 -timeout 30m 2>&1 | tee /tmp/race.log

      # Runs on failure AND success: a DATA RACE can be reported by a test that
      # still passes, so a green suite is not by itself proof of no race.
      - name: classify
        if: always()
        run: |
          races=$(grep -c 'WARNING: DATA RACE' /tmp/race.log || true)
          if [ "$races" -gt 0 ]; then
            echo "::error::$races DATA RACE report(s) — a real concurrency bug, triage immediately"
            grep -A25 'WARNING: DATA RACE' /tmp/race.log | head -100
            exit 1
          fi
          if [ "${{ steps.race.outcome }}" = "failure" ]; then
            echo "::warning::suite failed with ZERO data races — a failing or flaky test, not a concurrency bug"
            grep -E '^--- FAIL|^FAIL' /tmp/race.log | head -40
            echo "Known flaky under load, both pre-existing and tracked in docs/roadmap.md 6.7:"
            echo "  - internal/facadetest TestTintSystem_PhaseFollowsClusterTimeNotCell"
            echo "  - examples/4node-basic TestE2EMeshSplitMergeWithBotTraffic"
            echo "If the failure is one of those, it still needs fixing — do not re-run it away."
          fi

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    # 6 targets x 5 minutes = 30 minutes of mutation, plus build.
    timeout-minutes: 50
    # A newly discovered crasher must produce an artifact to triage, not a red
    # main. Committed seed corpora already run as ordinary subtests inside
    # ci.yml's `go test ./...`, so a *known* crasher is caught there; this job
    # exists to find new ones.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: extractions/setup-just@v4

      # `just fuzz` defaults to a 20-second smoke budget, which its own comment
      # calls "a smoke run, not a campaign; the real mutation budget belongs to
      # a scheduled CI job". This is that job, so it asks for 5 minutes per
      # target. That is what docs/roadmap.md §6.7's fuzz gate actually needs —
      # the seeds alone already execute under a plain `go test`.
      #
      # just stops the recipe at the first failing line, so a crasher in an
      # early target costs the later ones their budget. FuzzReflectUnmarshal is
      # last in the recipe for exactly that reason.
      - name: fuzz
        run: just fuzz 5m

      # Go writes discovered crashers into the target's
      # testdata/fuzz/<Target>/ directory, alongside the tracked seeds. Only
      # untracked entries are new, so diff against the index rather than
      # listing the directory.
      - name: report newly discovered corpus entries
        if: always()
        run: |
          set -euo pipefail
          new="$(git status --porcelain --untracked-files=all -- '*/testdata/fuzz/*')"
          if [ -n "$new" ]; then
            echo "::warning::go test -fuzz wrote new corpus entries — triage these as crashers:"
            echo "$new"
          else
            echo "No new fuzz corpus entries."
          fi

      # Uploads the whole corpus, tracked seeds included, so a crasher can be
      # reproduced locally without reconstructing the run. Cross-reference the
      # step above to see which entries are actually new.
      - name: upload fuzz corpora
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpora
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore
          retention-days: 14
