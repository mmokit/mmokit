# Required checks for every push and pull request.
#
# Long-running, expensive, or advisory gates (`-race`, fuzz mutation) live in
# `nightly.yml` and deliberately never run on the PR path.
#
# ---------------------------------------------------------------------------
# Scope
# ---------------------------------------------------------------------------
# This block used to enumerate "game-coupled jobs that do not survive the
# mmokit-core extraction", because docs/roadmap.md OSS-001 planned to publish
# the framework and keep the reference space game private. That decision was
# reversed: the whole repository is published and the space game ships as
# examples/space/, so there is no unpublished half and CI is not a subset of
# anything. The steps that read the game are ordinary example coverage.
#
# ---------------------------------------------------------------------------
# Action versions
# ---------------------------------------------------------------------------
# Verified resolvable on 2026-07-28. Newer majors exist (checkout v7, setup-go
# v7, setup-dotnet v6, setup-just v4) and have moved from the node20 runtime to
# node24; GitHub was still backporting to the majors pinned here eight days
# before that date. Bump them together and deliberately, not incidentally.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A branch in this repository with an open PR matches both triggers, so the
# event name is part of the group: a later push must not cancel the PR run that
# is actually reporting status on the merge commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go
    runs-on: ubuntu-latest
    # Above the suite's own `-timeout 900s` so Go's timeout fires first and
    # yields a goroutine dump. A job-level kill gives you nothing to read.
    timeout-minutes: 25
    steps:
      # Default shallow checkout. The gofmt step used to diff against a base
      # commit and needed fetch-depth: 0; it is now tree-wide over
      # `git ls-files`, which reads the index, and nothing else in this job
      # touches history.
      - uses: actions/checkout@v7

      # go.mod is the single place the Go version is pinned: `go 1.25.1` plus
      # `toolchain go1.26.2`. setup-go@v5 reads only the `go` directive from a
      # version file, so it installs 1.25.1 and the toolchain directive then
      # makes every `go` invocation re-exec into go1.26.2 (GOTOOLCHAIN=auto).
      # The result is the pinned toolchain either way. Do not also hard-code a
      # `go-version:` string here — it would silently win over the file.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # `go build ./...` is forbidden (AGENTS.md: it writes binaries into
      # package directories). `go vet ./...` compiles every package anyway and
      # takes well under a second warm, so it is both the compile check and the
      # lint.
      - name: go vet
        run: go vet ./...

      # Tree-wide. This was a changed-files-only gate, justified by a comment
      # claiming the 67 unformatted files were "almost entirely pre-existing Go
      # 1.19+ doc-comment reflow". That was measurably false: of the 424 changed
      # diff lines, 29 were comments and 17 blank — 89% was code (struct field
      # alignment, composite-literal alignment, and a genuinely misordered
      # import block in the space game's composition root). The tree was
      # formatted in the same commit that widened this gate, so it is green.
      #
      # gofmt is taken from `go env GOROOT` rather than PATH: PATH's gofmt
      # belongs to the version setup-go installed (1.25.1), while `go env`
      # re-execs into the pinned toolchain and reports go1.26.2's GOROOT. gofmt
      # output is toolchain-dependent, so the gate must measure what
      # contributors run.
      - name: gofmt
        run: |
          set -euo pipefail
          gofmt_bin="$(go env GOROOT)/bin/gofmt"
          mapfile -t files < <(git ls-files '*.go')
          printf 'Checking %d tracked Go file(s)\n' "${#files[@]}"
          unformatted="$("$gofmt_bin" -l "${files[@]}")"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            echo
            "$gofmt_bin" -d "${files[@]}"
            echo
            echo "Fix with: gofmt -w \$(git ls-files '*.go')"
            exit 1
          fi
          echo "All tracked Go files are gofmt-clean."

      # Fails if a non-allowlisted file in the space example's game layer
      # imports ark/ecs directly. The path is explicit: the script exits 2 when
      # the directory does not exist, so renaming the game layer reddens this
      # step instead of passing while checking nothing.
      - name: no ark in game layer
        run: ./scripts/no_ark_in_game.sh examples/space/internal/game

      # ONE test command, not a fast/slow split. ubuntu-latest permits
      # localhost TCP and UDP listeners, which is what docs/roadmap.md §6.7's
      # "Linux integration jobs" gate asks for: pkg/net/server_origin_test.go,
      # pkg/net/udp_server_test.go, pkg/net/udpclient/handshake_race_test.go,
      # pkg/admin/admin_e2e_test.go, examples/space/internal/bot/auth_test.go and
      # pkg/universe/udp_listener_test.go all bind localhost and all run here.
      #
      # `-p 1` is RETAINED INSURANCE, not a proven requirement. It exists
      # because pkg/universe has intermittently reported "executor: serialize
      # timeout on cell_0_0" under parallel package execution — CPU contention
      # on a RunOnLoop deadline, not a logic race. The recorded ~1-in-4 rate did
      # not reproduce at 17a9a2ce and has not reproduced since, but one passing
      # sample cannot refute it, so it stays. If you drop `-p 1` and see a
      # serialize timeout, that is this and not your change.
      #
      # Blind spot, stated so green is not read as complete: this covers zero
      # PostgreSQL code. All four */postgres packages sit behind `//go:build
      # pgtest` and report "[no test files]" — their tests are invisible, not
      # skipped. Only `just db-up && just test-pg` runs them, and no job here
      # provides a database.
      # -short on the merge path. examples/4node-basic's
      # TestE2EMeshSplitMergeWithBotTraffic skips under testing.Short(), and
      # docs/roadmap.md records it as "nondeterministic by construction" —
      # failure-then-pass on byte-identical code. A hosted runner is slower and
      # noisier than the box its passing runs were measured on, and a
      # flickering required check trains people to re-run rather than read. The
      # unshortened suite runs nightly, where a red is investigated rather than
      # dismissed.
      - name: go test
        run: go test ./... -short -count=1 -p 1 -timeout 900s

      # DB-free compile of every example's composition root. Written outside
      # the tree on purpose (AGENTS.md forbids building binaries into package
      # roots). This replaces a single `go build ./cmd/server`: two of the
      # three examples were never built by CI at all.
      - name: build every example
        run: |
          set -euo pipefail
          for ex in simple 4node-basic space; do
            echo "building examples/$ex"
            go build -o "/tmp/example-$ex" "./examples/$ex"
          done
          # The space example's load-test bot client lives beside it and
          # imports its internal packages; nothing else builds it.
          go build -o /tmp/space-botclient ./examples/space/botclient

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: extractions/setup-just@v4

      # HARD-PINNED to local dev's version. None of the three package.json
      # files declares an `engines` field or a `packageManager` field, and the
      # repository has no .nvmrc and no .tool-versions, so an unpinned bun would
      # drift silently and the first symptom would be an unrelated-looking test
      # failure. Bump this and the developer install together.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # No `bun install` before these two. pkg/quantize/ts has no package.json
      # at all, and the only bare specifier reachable from the two example web
      # test trees is a type-only `import type { Container } from "pixi.js"` in
      # examples/space/web/src/types.ts, which bun erases before resolution.
      # Verified by moving both node_modules trees aside: 53 + 147 tests pass.
      # The generated SDKs those suites import (examples/space/web/sdk and
      # examples/4node-basic/web/sdk, 16 files each) are tracked.
      - name: shared TypeScript codec/interpolation tests
        run: just ts-core-test

      # Client prediction, reconciliation and interpolation for both example
      # web clients, including the prediction golden that pairs with the space
      # example's shipdyn-golden.
      - name: example web-client TypeScript suites
        run: just web-test

      - name: web-admin install
        working-directory: web-admin
        run: bun install --frozen-lockfile

      - name: web-admin typecheck
        working-directory: web-admin
        run: bun run typecheck

      - name: web-admin unit tests
        working-directory: web-admin
        run: bun run test

      # Writes the embedded operator bundle into pkg/admin/static/dist, which is
      # tracked in full — pkg/admin/static/dist.go go:embed's it, so those bytes
      # are what a `go get` consumer's binary serves. The assert below is the
      # reason tracking generated output here is safe: a commit that changes the
      # SPA without rebuilding is caught on the merge path rather than shipping
      # a dashboard whose script tag points at a file that does not exist.
      - name: web-admin build
        working-directory: web-admin
        run: bun run build

      - name: assert the embedded admin bundle is up to date
        run: |
          # Untracked files do not appear in `git diff`, so a newly-hashed
          # asset that .gitignore swallowed would pass the diff below while
          # leaving the committed index.html pointing at a file nobody has.
          # Check for untracked entries FIRST.
          untracked="$(git status --porcelain --untracked-files=all -- pkg/admin/static/dist)"
          if [ -n "$untracked" ]; then
            echo "::error::pkg/admin/static/dist has untracked or modified files — the bundle was rebuilt but not committed, or .gitignore is swallowing an asset:"
            echo "$untracked"
            exit 1
          fi
          if ! git diff --exit-code -- pkg/admin/static/dist; then
            echo "::error::pkg/admin/static/dist is stale. Run 'just admin-build' and commit the result."
            exit 1
          fi
          # Belt and braces: the bundle must not be empty, and index.html must
          # reference assets that exist. A pathspec that matches nothing makes
          # the diff above pass vacuously.
          test -f pkg/admin/static/dist/index.html
          test -d pkg/admin/static/dist/assets
          grep -oE '/admin/assets/[^"]+' pkg/admin/static/dist/index.html | while read -r a; do
            f="pkg/admin/static/dist/${a#/admin/}"
            test -f "$f" || { echo "::error::index.html references missing asset $f"; exit 1; }
          done

  csharp:
    name: csharp
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # Pinned to the tracked solution file, which lists exactly
      # Mmokit.Sdk.Core and Mmokit.Sdk.Core.Tests. Mmokit.Sdk.SmokeBot is
      # excluded BY THE SOLUTION, and that is load-bearing: the smoke bot
      # compiles a generated SDK out of UNITY_SDK_DIR, which now has no default
      # and hard-errors when unset. Adding it here would have to be an explicit,
      # reviewable change rather than a directory glob picking it up.
      #
      # `just csharp-compile-test` is deliberately absent: it is a Go test that
      # shells out to dotnet and self-skips via exec.LookPath, so it belongs
      # with the Go job's toolchain assumptions, not here.
      - name: dotnet test
        run: dotnet test csharp/Mmokit.Sdk.slnx --nologo

  drift-go:
    name: drift-go
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # This job invokes just recipes, so it needs just. Installing it only in
      # the frontend job is the obvious mistake here.
      - uses: extractions/setup-just@v4

      # Closes docs/roadmap.md §6.7's cross-language golden-vector gate. Both
      # regenerators are pure Go and need no database.
      #
      # The generated-schema half is covered without a database by
      # examples/space/internal/game/sdk_typeid_parity_test.go, which runs in
      # the go job: it checks every wire type ID recorded in the committed
      # TypeScript SDK against the Go type names beside them, and those names
      # against the live server-event registry. `just client-sdk` still needs
      # PostgreSQL, so full regeneration remains a local step.
      - name: regenerate the C# wire golden
        run: just csharp-golden

      # Drives the real ShipDynamicsSystem + PhysicsSystem in the space example
      # and writes examples/space/web/src/__tests__/testdata. This is the gate
      # that fails when that game's system_ship_dynamics.go changes without its
      # client's prediction.ts.
      - name: regenerate the ship-dynamics parity fixture
        working-directory: examples/space
        run: just shipdyn-golden

      # `git diff --exit-code -- <pathspec>` exits 0 when the pathspec matches
      # NOTHING, so a renamed or deleted golden directory turns this gate green
      # while it checks nothing at all. Assert the files exist first: this gate
      # must fail loudly when its subject moves, not pass quietly.
      - name: assert the goldens exist
        run: |
          set -euo pipefail
          missing=0
          for f in \
            csharp/Mmokit.Sdk.Core.Tests/testdata/delta_golden.json \
            examples/space/web/src/__tests__/testdata/shipdyn_golden.json
          do
            if [ ! -f "$f" ]; then
              echo "::error::golden fixture missing: $f"
              echo "If it moved, update this step AND the regenerator's output path."
              missing=1
            fi
          done
          exit "$missing"

      - name: assert the goldens were already up to date
        run: |
          git diff --exit-code -- \
            csharp/Mmokit.Sdk.Core.Tests/testdata \
            examples/space/web/src/__tests__/testdata
