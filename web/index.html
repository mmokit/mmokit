<!DOCTYPE html>
<html>
<head>
    <title>Space MMO - Test Client</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: monospace; }
        canvas { display: block; }
        #hud {
            position: absolute; top: 10px; left: 10px;
            color: #0f0; font-size: 14px; line-height: 1.6;
            text-shadow: 0 0 4px #0f0;
        }
        #status {
            position: absolute; top: 10px; right: 10px;
            color: #ff0; font-size: 14px;
            text-shadow: 0 0 4px #ff0;
        }
        #chat {
            position: absolute; bottom: 40px; left: 10px;
            width: 350px;
            pointer-events: none;
        }
        #chat-messages {
            max-height: 200px;
            overflow: hidden;
            color: #ddd; font-size: 13px; line-height: 1.4;
            text-shadow: 0 0 2px #000, 0 0 4px #000;
        }
        #chat-input {
            width: 100%;
            background: rgba(0,0,0,0.7);
            border: 1px solid #0f0;
            color: #0f0;
            font-family: monospace;
            font-size: 13px;
            padding: 4px 6px;
            outline: none;
            pointer-events: auto;
            margin-top: 4px;
        }
        #controls {
            position: absolute; bottom: 10px; left: 10px;
            color: #888; font-size: 12px;
        }
    </style>

</head>
<body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="status">Connecting...</div>
    <div id="chat">
        <div id="chat-messages"></div>
        <input id="chat-input" type="text" maxlength="200" placeholder="Type a message..." style="display:none" />
    </div>
    <div id="controls">
        W/S or Up/Down: Thrust | A/D or Left/Right: Turn | Space: Fire | F: Mine | E: Sell | C: Cargo | Enter: Chat
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
