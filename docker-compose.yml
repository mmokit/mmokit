services:
  postgres:
    image: postgres:17-alpine
    container_name: mmoserver-postgres
    environment:
      POSTGRES_USER: mmo
      POSTGRES_PASSWORD: mmo
      POSTGRES_DB: mmo
    ports:
      - "5432:5432"
    volumes:
      - mmo-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmo -d mmo"]
      interval: 2s
      timeout: 1s
      retries: 10

volumes:
  mmo-pg-data:
